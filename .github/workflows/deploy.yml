name: Deploy to Azure

# Runs only after CI passes on main. Signs in to Azure with GitHub's OIDC token (no stored password),
# builds the image inside Azure Container Registry, rolls the Container App to it, then checks health.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Identifiers only (not secrets). GitHub signs in with OIDC; Azure trusts only this repo's main branch.
env:
  RG: kaamka-rg
  APP: kaamka-app
  AZURE_CLIENT_ID: cd3c420e-60b4-49c7-88c7-3e078fc7d400
  AZURE_TENANT_ID: 0247269c-18c6-4907-abe2-4bf639f1034c
  AZURE_SUBSCRIPTION_ID: d3d45a77-4da7-4de5-8e78-33a78360a0b8
  ACR_NAME: kaamkaacrd3d45a

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # Built on the GitHub runner and pushed (ACR Tasks / `az acr build` is unavailable on free-trial subscriptions).
      - name: Build and push image
        run: |
          TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          IMAGE="$ACR_NAME.azurecr.io/kaamka:$TAG"
          az acr login --name "$ACR_NAME"
          docker build --build-arg GIT_SHA="$TAG" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Roll out new revision
        run: |
          # Azure occasionally rejects an update while a previous operation settles; retry a few times.
          for i in 1 2 3; do
            az containerapp update -g "$RG" -n "$APP" --image "$IMAGE" --output none && break
            [ "$i" = 3 ] && exit 1; echo "retrying in 30s"; sleep 30
          done
          # Scheduled jobs (Phase 7) run the same image; skipped if they haven't been created yet.
          for JOB in kaamka-job-publish kaamka-job-metrics kaamka-job-token; do
            if az containerapp job show -g "$RG" -n "$JOB" --query name -o tsv >/dev/null 2>&1; then
              az containerapp job update -g "$RG" -n "$JOB" --image "$IMAGE" --output none || echo "::warning::could not update $JOB"
            fi
          done
          FQDN=$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "FQDN=$FQDN" >> "$GITHUB_ENV"

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            # Healthy only when the NEW version answers (Azure keeps serving the old revision if the new one crashes).
            body=$(curl -s "https://$FQDN/healthz" || true)
            if echo "$body" | grep -q "\"version\":\"$TAG\""; then echo "Healthy on $TAG: https://$FQDN"; exit 0; fi
            sleep 10
          done
          echo "::error::App did not become healthy at https://$FQDN"
          az containerapp logs show -g "$RG" -n "$APP" --revision "$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)" --tail 50 --format text || true
          exit 1
